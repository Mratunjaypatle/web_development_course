<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            display: flex;
            background-color: rgb(162, 185, 208);
            flex-direction: row;
   
        }

        .container div {
            background-color: rgb(118, 16, 62);
            margin: 10px;
            padding: 20px;
            font-size: 30px;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div  >Box1</div>
        <div  >Box2</div>
        <div  >Box3</div>
        <div >Box4</div>
        <div >Box5</div>
        <div >Box6</div>
        <div >Box7</div>
        <div >Box8</div>
    </div>

</body>

</html>
