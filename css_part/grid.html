<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
         .grid
         {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            /* grid-template-row: 1fr 1fr 1fr; */
            gap:20px
         }
         .grid div
         {
            background-color: #387868;   
            color: white;
            padding: 20px;
            text-align: center;
            border: 1px solid black;
            border-radius: 8px;
         }
    </style>
</head>
<body>
    
     <div class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
     </div>

</body>
</html>
